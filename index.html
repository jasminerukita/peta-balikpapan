<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Kota Balikpapan</title>

  <!-- Tampilan bawaan Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* Ukuran kanvas peta (ketentuan 5: bebas). Tinggi WAJIB diisi, kalau tidak peta tidak muncul */
    #map {
      width: 100%;
      height: 500px;
    }
  </style>
</head>
<body>

  <h2>Peta Kota Balikpapan</h2>

  <!-- Kotak tempat peta digambar -->
  <div id="map"></div>

  <!-- Mesin Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Ketentuan 1: peta berpusat di Balikpapan, zoom awal 12 (batas 10-15)
    var map = L.map('map', {
      minZoom: 10,
      maxZoom: 15
    }).setView([-1.2565, 116.8571], 12);

    // Ketentuan 2: background tile OpenStreetMap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 15,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Ketentuan 3: marker di lokasi kota
    var marker = L.marker([-1.2565, 116.8571]).addTo(map);

    // Ketentuan 4: popup berisi nama kota dan nama kamu
    marker.bindPopup("<b>Kota Balikpapan</b><br>Dibuat oleh: Jasmine").openPopup();
  </script>

</body>
</html>
